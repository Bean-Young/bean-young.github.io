<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.trycloudflare.com; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'">
<title>SJTU 终端</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>SJTU 终端</h1><div class="connection"><span id="status" role="status">未连接</span><button id="logout" class="secondary" hidden>退出</button></div></header>
<main>
<section class="terminal" aria-label="SJTU 终端">
<form id="login" class="login">
<h2>连接你的终端</h2><p>实时查看当前屏幕，不保存历史输出</p>
<label for="password">访问密码</label><input id="password" type="password" autocomplete="off" placeholder="请输入访问密码" required>
<button id="connect" type="submit">连接</button><p id="login-error" class="error" role="alert"></p>
</form>
<div id="workspace" hidden>
<pre id="screen" tabindex="0" aria-label="当前终端屏幕"></pre>
<div class="composer"><form id="command-form"><label for="command">命令</label><input id="command" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入命令，按 Enter 执行" disabled><button id="execute" type="submit" disabled>执行</button><button id="interrupt" type="button" class="secondary" disabled>中断</button></form><p id="command-message" role="status">命令将在 SJTU 执行，不保存历史输出</p></div>
</div>
</section>
<footer><span>当前屏幕 · 不保存历史输出</span><span>每秒同步</span></footer>
</main><script src="app.js"></script>
</body></html>

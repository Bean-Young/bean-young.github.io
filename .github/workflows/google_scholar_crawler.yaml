# Copied from https://github.com/RayeRen/acad-homepage.github.io/blob/main/.github/workflows/google_scholar_crawler.yaml
# + permissions (required for GITHUB_TOKEN to push a branch on current GitHub).
name: Get Citation Data

on:
  page_build:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Reqs
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Restore Last Successful Data
        run: |
          git fetch origin google-scholar-stats
          mkdir -p google_scholar_crawler/results
          for file in gs_data.json gs_data_shieldsio.json gs_publication_citations.json; do
            if git show "origin/google-scholar-stats:${file}" > "google_scholar_crawler/results/${file}.tmp"; then
              mv "google_scholar_crawler/results/${file}.tmp" "google_scholar_crawler/results/${file}"
            else
              rm -f "google_scholar_crawler/results/${file}.tmp"
            fi
          done

      - name: Run
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd ./google_scholar_crawler
          if ! timeout 120s python main.py; then
            echo "::warning::Scholar profile update timed out; keeping the last successful data."
          fi
          python github_stars.py
          if ! timeout 180s python update_paper_graph_citations.py; then
            echo "::warning::Paper citation update timed out; keeping the last successful data."
          fi
          cd ./results
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git add *.json
          git commit -m "Updated Citation Data"
          git push "${remote_repo}" HEAD:google-scholar-stats --force
